<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>開催日管理</title>
  <link rel="stylesheet" th:href="@{/admin/admin.css}">
</head>
<body>
<header th:replace="~{admin/fragments :: header}"></header>
<main class="page">
  <h1><span th:replace="~{admin/fragments :: icon-schedules}"></span>開催日管理</h1>

  <section class="panel">
    <div class="panel-heading"><h2>開催日作成</h2></div>
    <div class="panel-body">
      <form class="toolbar" th:action="@{/admin/schedules}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>日付<input type="date" name="scheduleDate" required></label>
        <label>メモ<input type="text" name="note" maxlength="500"></label>
        <label><span>公開</span><input type="checkbox" name="open" value="true" checked></label>
        <button type="submit">作成</button>
      </form>
    </div>
  </section>

  <section class="panel" th:each="schedule : ${schedules}">
    <div class="panel-heading">
      <h2 th:text="${schedule.scheduleDate}">date</h2>
    </div>
    <div class="panel-body stack">
      <form class="toolbar" th:action="@{/admin/schedules/{id}(id=${schedule.id})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="open" value="false">
        <label><span>公開</span><input type="checkbox" name="open" value="true" th:checked="${schedule.open}"></label>
        <label>メモ<input type="text" name="note" th:value="${schedule.note}" maxlength="500"></label>
        <button type="submit">開催日を更新</button>
      </form>

      <table>
        <thead><tr><th>時間枠</th><th>更新</th></tr></thead>
        <tbody>
        <tr th:each="slot : ${schedule.timeSlots}">
          <td>
            <strong th:text="${#temporals.format(slot.startTime, 'HH:mm')} + '-' + ${#temporals.format(slot.endTime, 'HH:mm')}">11:00-12:00</strong>
            <span class="muted" th:text="'予約済み ' + ${slot.reservedCount} + ' / 残席 ' + ${slot.remainingCount()}">予約済み 0 / 残席 10</span>
          </td>
          <td>
            <form class="inline-form" th:action="@{/admin/schedules/slots/{id}(id=${slot.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <label>定員<input type="number" name="capacity" min="0" th:value="${slot.capacity}"></label>
              <input type="hidden" name="active" value="false">
              <label><span>受付</span><input type="checkbox" name="active" value="true" th:checked="${slot.active}"></label>
              <button type="submit">更新</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(schedule.timeSlots)}"><td colspan="2" class="muted">時間枠はありません。</td></tr>
        </tbody>
      </table>

      <form class="toolbar" th:action="@{/admin/schedules/slots}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="scheduleId" th:value="${schedule.id}">
        <label>開始<input type="time" name="startTime" required></label>
        <label>終了<input type="time" name="endTime" required></label>
        <label>定員<input type="number" name="capacity" min="0" value="10"></label>
        <label><span>受付</span><input type="checkbox" name="active" value="true" checked></label>
        <button type="submit">時間枠を作成</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
