<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>問い合わせ管理</title>
  <link rel="stylesheet" th:href="@{/admin/admin.css}">
</head>
<body>
<header th:replace="~{admin/fragments :: header}"></header>
<main class="page">
  <h1><span th:replace="~{admin/fragments :: icon-inquiries}"></span>問い合わせ管理</h1>
  <section class="panel">
    <div class="panel-body">
      <table>
        <thead><tr><th>受付日時</th><th>氏名</th><th>メール</th><th>ステータス</th><th></th></tr></thead>
        <tbody>
        <tr th:each="inquiry : ${inquiries}">
          <td th:text="${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}">date</td>
          <td th:text="${inquiry.customerName()}">name</td>
          <td th:text="${inquiry.customerEmail}">mail</td>
          <td><span class="badge" th:attr="data-status=${inquiry.status.name()}" th:text="${inquiry.status.label}">status</span></td>
          <td><a th:href="@{/admin/inquiries/{id}(id=${inquiry.id})}">詳細</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(inquiries)}"><td colspan="5" class="muted">問い合わせはありません。</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
