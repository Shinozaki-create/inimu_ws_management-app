<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header class="admin-header" th:fragment="header">
  <div class="admin-header-inner">
    <a class="brand" th:href="@{/admin}">Workshop Admin</a>
    <nav class="nav" aria-label="管理メニュー">
      <a class="nav-button" th:href="@{/admin}">ダッシュボード</a>
      <a class="nav-button" th:href="@{/admin/reservations}">予約</a>
      <a class="nav-button" th:href="@{/admin/schedules}">開催日</a>
      <a class="nav-button" th:href="@{/admin/sales}">売上</a>
      <a class="nav-button" th:href="@{/admin/inquiries}">問い合わせ</a>
      <form th:action="@{/admin/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="secondary" type="submit">ログアウト</button>
      </form>
    </nav>
  </div>
</header>
</body>
</html>
