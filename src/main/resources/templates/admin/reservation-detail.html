<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>予約詳細</title>
  <link rel="stylesheet" th:href="@{/admin/admin.css}">
</head>
<body>
<header th:replace="~{admin/fragments :: header}"></header>
<main class="page">
  <h1>予約詳細</h1>
  <div class="two-column">
    <section class="panel">
      <div class="panel-heading"><h2 th:text="${reservation.reservationCode}">code</h2></div>
      <div class="panel-body">
        <table>
          <tbody>
          <tr><th>予約日時</th><td th:text="${reservation.reservationDate} + ' ' + ${#temporals.format(reservation.reservationTime, 'HH:mm')}">date</td></tr>
          <tr><th>人数</th><td th:text="${reservation.reservationCount}">0</td></tr>
          <tr><th>合計金額</th><td th:text="${reservation.totalAmount} + '円'">0円</td></tr>
          <tr><th>氏名</th><td th:text="${reservation.customerName()}">name</td></tr>
          <tr><th>カナ</th><td th:text="${reservation.customerFamilyKana} + ' ' + ${reservation.customerGivenKana}">kana</td></tr>
          <tr><th>メール</th><td th:text="${reservation.customerEmail}">mail</td></tr>
          <tr><th>電話</th><td th:text="${reservation.customerTel}">tel</td></tr>
          <tr><th>メッセージ</th><td th:text="${reservation.customerMessage}">message</td></tr>
          <tr><th>状態</th><td><span class="badge" th:text="${reservation.status.label}">status</span></td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-heading"><h2>ステータス変更</h2></div>
      <div class="panel-body">
        <form class="stack" th:action="@{/admin/reservations/{id}/status(id=${reservation.id})}" method="post" th:object="${updateRequest}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <label>ステータス
            <select th:field="*{status}">
              <option th:each="status : ${reservationStatuses}" th:value="${status}" th:text="${status.label}">status</option>
            </select>
          </label>
          <label>管理メモ
            <textarea th:field="*{adminMemo}"></textarea>
          </label>
          <button type="submit">更新</button>
        </form>
      </div>
    </section>
  </div>
</main>
</body>
</html>
